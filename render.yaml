services:
  # ============================================================================
  # 1. LeadQualify AI - FastAPI Python Backend Service
  # ============================================================================
  - type: web
    name: leadqualify-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./leadqualify.db
      - key: SECRET_KEY
        generateValue: true

  # ============================================================================
  # 2. LeadQualify AI - Next.js Enterprise Dashboard Frontend
  # ============================================================================
  - type: web
    name: leadqualify-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: leadqualify-backend
          property: host
