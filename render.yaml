services:
  # ============================================================================
  # LeadQualify AI - Unified Enterprise Platform (FastAPI Backend + Next.js UI)
  # Deploys as a single Web Service on Render Free Tier in 1 click
  # ============================================================================
  - type: web
    name: leadqualify-ai
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./leadqualify.db
      - key: SECRET_KEY
        generateValue: true
